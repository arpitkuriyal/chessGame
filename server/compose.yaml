services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess_dev_only
      POSTGRES_DB: chess_game
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chess_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_game"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  chess_postgres_data:
